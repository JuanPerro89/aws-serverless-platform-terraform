name: Deploy
on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

concurrency: deploy-dev

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - run: |
          terraform -chdir=infra/envs/dev init
          terraform -chdir=infra/envs/dev apply -auto-approve
      - name: Publicar web
        run: |
          T="terraform -chdir=infra/envs/dev output -raw"
          echo "window.API_URL='$($T api_url)';" > web/config.js
          aws s3 sync web "s3://$($T web_bucket)" --delete
          aws cloudfront create-invalidation --distribution-id "$($T distribution_id)" --paths "/*"